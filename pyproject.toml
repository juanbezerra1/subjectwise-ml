[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "subjectwise-ml"
version = "0.1.0"
description = "Leakage-free evaluation and simulation-based power analysis for classifiers trained on a handful of subjects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Bezerra" }]
keywords = [
    "machine-learning", "cross-validation", "data-leakage", "leave-one-subject-out",
    "permutation-test", "power-analysis", "biosignals", "small-sample",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.2",
    "matplotlib>=3.7",
    "typer>=0.15.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
subjectwise = "subjectwise.cli:app"

[project.urls]
Homepage = "https://github.com/juanbezerra1/subjectwise-ml"
Issues = "https://github.com/juanbezerra1/subjectwise-ml/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/subjectwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
